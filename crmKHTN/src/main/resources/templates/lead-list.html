<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - Quản lý Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); }
        .sidebar a { color: rgba(255, 255, 255, 0.8); text-decoration: none; padding: 15px 20px; display: block; font-weight: 600; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: rgba(255, 255, 255, 0.1); border-left: 4px solid #fff; }
        .card { box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); border: none; border-radius: 0.5rem; }
        .table th { background-color: #f8f9fc; color: #4e73df; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar" style="width: 250px;">
        <div class="p-4 text-center text-white">
            <h4><i class="fa-solid fa-chart-pie me-2"></i>CRM PRO</h4>
        </div>
        <ul class="list-unstyled">
            <li><a href="#" class="active"><i class="fa-solid fa-users me-2"></i> Quản lý Leads</a></li>
            <li><a href="#"><i class="fa-solid fa-file-contract me-2"></i> Hợp đồng</a></li>
            <li><a href="#"><i class="fa-solid fa-box me-2"></i> Dịch vụ/Sản phẩm</a></li>
        </ul>
    </div>

    <div class="flex-grow-1">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow-sm px-4 py-3">
            <h5 class="mb-0 text-gray-800 fw-bold">Danh sách Khách hàng tiềm năng</h5>
        </nav>

        <div class="container-fluid px-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-check-circle me-1"></i> <strong th:text="${successMessage}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center bg-white border-bottom">
                    <h6 class="m-0 fw-bold text-primary"><i class="fa-solid fa-list me-1"></i> Dữ liệu Leads</h6>
                    <a th:href="@{/leads/new}" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Thêm mới</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên Liên Hệ</th>
                                <th>Công Ty</th>
                                <th>SĐT / Email</th>
                                <th>Doanh thu dự kiến</th>
                                <th>Trạng thái (ID)</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="lead : ${listLeads}">
                                <td th:text="${lead.leadId}" class="text-muted fw-bold">1</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-2"
                                             style="width: 35px; height: 35px; font-weight: bold; text-transform: uppercase;"
                                             th:text="${#strings.isEmpty(lead.contactName) ? '?' : #strings.substring(lead.contactName,0,1)}">A</div>
                                        <div class="d-flex flex-column">
                                            <span th:text="${lead.contactName}" class="fw-bold text-dark">Tên</span>
                                            <small class="text-muted" th:text="${lead.address}">Địa chỉ</small>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${lead.companyName}">Công ty</td>
                                <td>
                                    <div class="d-flex flex-column">
                                        <span th:text="${lead.phone}">09xx</span>
                                        <small class="text-muted" th:text="${lead.email}">email@</small>
                                    </div>
                                </td>
                                <td class="text-success fw-bold" th:text="${lead.expectedRevenue != null ? #numbers.formatDecimal(lead.expectedRevenue, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : ''}">0 VNĐ</td>
                                <td class="text-center">
                                    <th:block th:switch="${lead.statusId}">
        <span th:case="1" class="badge bg-info text-dark px-3 py-2 rounded-pill">
            <i class="fa-solid fa-sparkles me-1"></i> Mới
        </span>

                                        <span th:case="2" class="badge bg-warning text-dark px-3 py-2 rounded-pill">
            <i class="fa-solid fa-phone me-1"></i> Đang liên hệ
        </span>

                                        <span th:case="3" class="badge bg-success px-3 py-2 rounded-pill">
            <i class="fa-solid fa-check me-1"></i> Đã chuyển đổi
        </span>

                                        <span th:case="*" class="badge bg-secondary px-3 py-2 rounded-pill">
            Chưa phân loại
        </span>
                                    </th:block>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/leads/view/{id}(id=${lead.leadId})}" class="btn btn-sm btn-outline-info" title="Xem chi tiết">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                    <a th:href="@{/leads/edit/{id}(id=${lead.leadId})}" class="btn btn-sm btn-outline-primary" title="Sửa">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <a th:href="@{/leads/delete/{id}(id=${lead.leadId})}" class="btn btn-sm btn-outline-danger ms-1"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này?');" title="Xóa">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
